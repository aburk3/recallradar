name: refresh-and-deploy
on:
  push: { branches: [main] }
  schedule: [{ cron: '17 6 * * *' }]
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Refresh data (scheduled/manual only)
        if: github.event_name != 'push'
        run: node scripts/fetch.mjs
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "recallradar-bot"; git config user.email "bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "Refresh data" && git push)
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
